[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
logfile_maxbytes=5MB
logfile_backups=1
pidfile=/tmp/supervisord.pid
user=root

; ── SearXNG web process ──────────────────────────────────────────
; Uses the same entrypoint as the base searxng/searxng image.
[program:searxng]
command=/usr/local/bin/python -m granian
    --interface asgi
    --host 0.0.0.0
    --port 8080
    --workers 1
    --log-level info
    searx.webapp:app
directory=/usr/local/searxng
environment=SEARXNG_SETTINGS_PATH="/etc/searxng/settings.yml"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
startsecs=5
priority=10

; ── MCP Server process ───────────────────────────────────────────
[program:mcp-server]
command=/usr/local/bin/python -m mcp_server
directory=/app/mcp
environment=
    MCP_SEARXNG_HOST="0.0.0.0",
    MCP_SEARXNG_PORT="8101",
    MCP_SEARXNG_BASE_URL="http://127.0.0.1:8080",
    MCP_SEARXNG_LOG_LEVEL="info"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
startsecs=3
priority=20
; Wait for SearXNG to be up before starting (best-effort)
startretries=5
